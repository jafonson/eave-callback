<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src https://akhfynhyjnxsvrrusmhg.supabase.co; base-uri 'none'; form-action 'none'"
    />
    <title>Eave</title>
    <style>
      :root {
        --bg: #0a0c11;
        --sf2: #171b24;
        --bd2: #313846;
        --tx: #edf0f5;
        --tx2: #98a1b1;
        --tx3: #666e7e;
        --brand: #7fa8ff;
        --brandh: #a3c1ff;
        --onbrand: #0a0c11;
        --pos: #4fd9a4;
        --posq: rgba(79, 217, 164, 0.13);
        --amb: #f5c265;
        --ambq: rgba(245, 194, 101, 0.14);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--tx);
        font-family:
          'Space Grotesk',
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px 28px;
        text-align: center;
      }
      .badge {
        width: 72px;
        height: 72px;
        border-radius: 36px;
        display: grid;
        place-items: center;
      }
      .badge svg {
        width: 36px;
        height: 36px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      [hidden] {
        display: none !important;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        font-size: 15px;
        line-height: 1.55;
        color: var(--tx2);
        max-width: 300px;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 24px;
        border-radius: 12px;
        background: var(--brand);
        color: var(--onbrand);
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
      }
      .button:hover {
        background: var(--brandh);
      }
      .button.quiet {
        background: var(--sf2);
        color: var(--tx);
        box-shadow: inset 0 0 0 1px var(--bd2);
      }
      .foot {
        margin-top: 8px;
        font-size: 12.5px;
        line-height: 1.5;
        color: var(--tx3);
      }
      .foot button {
        all: unset;
        cursor: pointer;
        color: var(--brand);
      }
      .foot button:hover {
        color: var(--brandh);
      }
      .foot button:focus-visible,
      .button:focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main aria-live="polite">
      <svg
        data-icon="bounce"
        viewBox="0 0 64 64"
        width="72"
        height="72"
        role="img"
        aria-label="Eave"
      >
        <rect x="22.5" y="27.25" width="22" height="9.5" rx="4.75" fill="#ffffff" />
        <rect x="22.5" y="38.5" width="28" height="9.5" rx="4.75" fill="#ffffff" />
        <rect x="11.5" y="16" width="41" height="9.5" rx="4.75" fill="#7fa8ff" />
      </svg>
      <span
        class="badge"
        data-icon="connected"
        hidden
        style="background: var(--posq); color: var(--pos)"
        aria-hidden="true"
      >
        <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
      </span>
      <span
        class="badge"
        data-icon="refused"
        hidden
        style="background: var(--ambq); color: var(--amb)"
        aria-hidden="true"
      >
        <svg viewBox="0 0 24 24">
          <path d="M9.5 14.5l-2 2a3.5 3.5 0 0 1-5-5l2-2" />
          <path d="M14.5 9.5l2-2a3.5 3.5 0 0 1 5 5l-2 2" />
          <path d="M4 4l16 16" />
        </svg>
      </span>
      <span
        class="badge"
        data-icon="used"
        hidden
        style="background: var(--sf2); color: var(--tx2)"
        aria-hidden="true"
      >
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v5l3 2" />
        </svg>
      </span>
      <h1 id="title">A voltar à Eave…</h1>
      <p id="body">Se a Eave não abrir sozinha, toque no botão.</p>
      <a id="open" class="button quiet" href="eave://">Abrir Eave</a>
      <p class="foot"><span id="note"></span><button id="lang" type="button">English</button></p>
    </main>
    <script type="module" src="callback.js"></script>
  </body>
</html>
